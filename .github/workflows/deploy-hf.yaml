name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Hugging Face Space files
        run: |
          # Move isolated HF files to the root of the repository
          cp hf-deployment/app.py .
          cp hf-deployment/packages.txt .
          
          # Combine Python requirements
          cat app/backend/services/ocr-engine/requirements.txt hf-deployment/requirements.txt > requirements.txt
          
          # Configure git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Create a temporary branch for the deployment
          git checkout -b hf-deploy-branch
          
          # Remove unnecessary folders containing binary files (frontend, test data)
          git rm -rf Test_Data/ app/frontend/
          
          # Add the newly created root files
          git add app.py packages.txt requirements.txt
          
          # Commit the changes to the temporary branch
          git commit -m "Prepare files for Hugging Face Space deployment"
          
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_REPO" ]; then
            echo "Error: HF_TOKEN and HF_SPACE_REPO secrets must be set in GitHub repository settings."
            exit 1
          fi
          
          # Add the Hugging Face Space remote
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO
          
          # Force push the temporary branch to the main branch of the Hugging Face Space
          git push hf hf-deploy-branch:main --force
