name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Hugging Face Space files
        run: |
          # Create a clean deployment directory
          mkdir -p /tmp/hf-space

          # Copy backend code, but strip out anything that must never
          # land in the public Space: real .env files, local signing
          # keys, coverage reports, build artefacts, and the dist tree
          # the prod path can rebuild on first boot. rsync --exclude
          # gives us a clean recursive copy in one pass.
          rsync -a --delete \
            --exclude='.env' --exclude='.env.*' \
            --exclude='.keys/' \
            --exclude='coverage/' \
            --exclude='dist/' \
            --exclude='node_modules/' \
            --exclude='supabase/.temp/' \
            --exclude='.turbo/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            app/backend/ /tmp/hf-space/backend/

          # Use the Gradio entry point from app/app.py - it is a
          # ZeroGPU-compatible launcher (decorates a function with
          # @spaces.GPU at module scope so HF's startup detector finds
          # it). The legacy hf-deployment/app.py was a plain subprocess
          # launcher that never registered a @spaces.GPU function and
          # therefore failed the ZeroGPU readiness check with
          # "No @spaces.GPU function detected during startup".
          cp app/app.py /tmp/hf-space/app.py
          cp hf-deployment/packages.txt /tmp/hf-space/

          # Build the Space's requirements.txt: the Space's own Python
          # deps (gradio + spaces) are required for the launcher to
          # import; the OCR engine's requirements are appended so the
          # on-demand OCR tab works. We de-duplicate by package name so
          # a pin in the Space's own list is not overridden by the OCR
          # engine's looser version.
          cp app/requirements.txt /tmp/hf-space/requirements.txt
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            [[ "$pkg" =~ ^# ]] && continue
            name="${pkg%%[<>=! ]*}"
            if ! grep -E "^${name}([<>=! ]|$)" /tmp/hf-space/requirements.txt > /dev/null; then
              echo "$pkg" >> /tmp/hf-space/requirements.txt
            fi
          done < app/backend/services/ocr-engine/requirements.txt

          # Inject README.md with Hugging Face Space configuration
          cat << 'EOF' > /tmp/hf-space/README.md
          ---
          title: Backend API
          emoji: 🚀
          colorFrom: blue
          colorTo: indigo
          sdk: gradio
          python_version: 3.12
          app_file: app.py
          pinned: false
          sdk_version: 6.26.0
          ---
          # Clearpath Backend
          This space hosts the backend API and OCR engine.
          EOF

          # Initialize a fresh git repository to avoid pushing history with binary files
          cd /tmp/hf-space
          git init
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Add all files
          git add .

          # Commit the changes
          git commit -m "Deploy to Hugging Face Space"

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_REPO" ]; then
            echo "Error: HF_TOKEN and HF_SPACE_REPO secrets must be set in GitHub repository settings."
            exit 1
          fi

          cd /tmp/hf-space

          # Add the Hugging Face Space remote
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO

          # Force push to the main branch of the Hugging Face Space
          git push hf master:main --force || git push hf main:main --force