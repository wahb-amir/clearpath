name: Worker Tests

on:
  push:
    paths:
      - "app/backend/src/workers/**"
      - "app/backend/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "app/backend/src/workers/**"
      - "app/backend/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/worker-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Worker Stage Tests
    runs-on: ubuntu-latest

    env:
      # Ensures pnpm v11 runs fully non-interactively (no TTY prompts for
      # build-script approval) and strictly honors allowBuilds in
      # pnpm-workspace.yaml instead of hanging/failing on unapproved builds.
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          # The workspace lockfile lives at the repo root (pnpm-workspace.yaml
          # covers app/* and services/*) -- there is no separate lockfile
          # inside app/backend.
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        # Must run from the repo root: pnpm resolves the workspace root via
        # pnpm-workspace.yaml, and --frozen-lockfile + retry guards against
        # the transient registry/network flakiness that's been failing this
        # step intermittently.
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && break
            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after 3 attempts" >&2
              exit 1
            fi
            echo "pnpm install failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done

      - name: Run worker tests
        working-directory: app/backend
        run: pnpm test

      - name: Run tests with coverage
        working-directory: app/backend
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/backend/coverage/
          retention-days: 7
