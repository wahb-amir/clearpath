name: Worker Tests

on:
  push:
    paths:
      - "app/backend/src/workers/**"
      - "app/backend/package.json"
      - "app/backend/pnpm-lock.yaml"
      - "app/backend/vitest.config.ts"
      - "pnpm-workspace.yaml"
      - "pnpm.yaml"
      - ".npmrc"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "app/backend/src/workers/**"
      - "app/backend/package.json"
      - "app/backend/pnpm-lock.yaml"
      - "app/backend/vitest.config.ts"
      - "pnpm-workspace.yaml"
      - "pnpm.yaml"
      - ".npmrc"
      - ".github/workflows/worker-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Worker Stage Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "app/backend/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm ci

      - name: Run worker tests
        run: pnpm test

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/backend/coverage/
          retention-days: 7
